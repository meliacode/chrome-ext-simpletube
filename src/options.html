<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SimpleTube — Options</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <main class="sptcl-grid-content-wrapper">
            <section class="sptcl-cp-hero">
                <div class="sptcl-cp-hero-head sptcl-grid-panel">
                    <p class="sptcl-el-eyebrow" data-i18n="optionsEyebrow"></p>
                    <h1>
                        <span class="sptcl-el-brand-color">SimpleTube</span>
                        <span id="sptid-version" class="sptcl-el-brand-note"></span>
                        <span class="sptcl-el-title" data-i18n="optionsProductTitle"></span>
                    </h1>
                    <p class="sptcl-el-description" data-i18n="optionsDescription"></p>
                </div>

                <aside class="sptcl-cp-hero-card sptcl-grid-panel">
                    <h2 data-i18n="feedbackTitle"></h2>
                    <p data-i18n="feedbackDescription"></p>
                    <a
                        class="sptcl-el-link"
                        href="https://chromewebstore.google.com/detail/simpletube-youtube-filter/ipjkpeklopbgkjokfejpgignhmegjfca"
                        target="_blank"
                        rel="noreferrer"
                        data-i18n="openStorePage"
                    ></a>
                </aside>
            </section>

            <div id="sptid-alert-message" class="sptcl-cp-alert-message" role="status" aria-live="polite"></div>

            <section class="sptcl-cp-section sptcl-grid-panel">
                <div class="sptcl-cp-section-header">
                    <h2 data-i18n="generalOptions"></h2>
                    <p class="sptcl-cp-section-description" data-i18n="generalOptionsDescription"></p>
                </div>

                <label for="sptid-do-hide-watched" class="sptcl-opt-grouped">
                    <span class="sptcl-opt-grouped-inner">
                        <input type="checkbox" id="sptid-do-hide-watched" class="sptcl-form-checkbox-input" />
                        <span>
                            <span class="sptcl-opt-label-text" data-i18n="hideWatchedTitle"></span>
                            <span class="sptcl-opt-label-help" data-i18n="hideWatchedHelp"></span>
                        </span>
                    </span>
                    <span class="sptcl-opt-label-default" data-i18n="defaultOff"></span>
                </label>

                <label for="sptid-do-hide-shorts" class="sptcl-opt-grouped">
                    <span class="sptcl-opt-grouped-inner">
                        <input type="checkbox" id="sptid-do-hide-shorts" class="sptcl-form-checkbox-input" />
                        <span>
                            <span class="sptcl-opt-label-text" data-i18n="hideShortsTitle"></span>
                            <span class="sptcl-opt-label-help" data-i18n="hideShortsHelp"></span>
                        </span>
                    </span>
                    <span class="sptcl-opt-label-default" data-i18n="defaultOff"></span>
                </label>

                <label for="sptid-do-hide-subscriptions-expandable-sections" class="sptcl-opt-grouped">
                    <span class="sptcl-opt-grouped-inner">
                        <input
                            type="checkbox"
                            id="sptid-do-hide-subscriptions-expandable-sections"
                            class="sptcl-form-checkbox-input"
                        />
                        <span>
                            <span class="sptcl-opt-label-text" data-i18n="hideExpandableTitle"></span>
                            <span class="sptcl-opt-label-help" data-i18n="hideExpandableHelp"></span>
                        </span>
                    </span>
                    <span class="sptcl-opt-label-default" data-i18n="defaultOff"></span>
                </label>
            </section>

            <section class="sptcl-cp-section sptcl-grid-panel">
                <div class="sptcl-cp-section-header">
                    <h2 data-i18n="videoLengthTitle"></h2>
                    <p class="sptcl-cp-section-description" data-i18n="videoLengthDescription"></p>
                </div>

                <label for="sptid-do-fade-by-length" class="sptcl-opt-grouped">
                    <span class="sptcl-opt-grouped-inner">
                        <input type="checkbox" id="sptid-do-fade-by-length" class="sptcl-form-checkbox-input" />
                        <span>
                            <span class="sptcl-opt-label-text" data-i18n="applyLengthTitle"></span>
                            <span class="sptcl-opt-label-help" data-i18n="applyLengthHelp"></span>
                        </span>
                    </span>
                    <span class="sptcl-opt-label-default" data-i18n="defaultOn"></span>
                </label>

                <div id="sptid-video-length-group">
                    <div class="sptcl-grid-fields">
                        <div class="sptcl-opt-grouped">
                            <label
                                for="sptid-video-length-min"
                                class="sptcl-opt-label-text"
                                data-i18n="minimumLength"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="minimumLengthHelp"></span>
                            <select id="sptid-video-length-min" class="sptcl-form-select-input">
                                <option value="0" data-i18n="zeroMinutes"></option>
                                <option value="5" data-i18n="fiveMinutes"></option>
                                <option value="10" data-i18n="tenMinutes"></option>
                                <option value="20" data-i18n="twentyMinutes"></option>
                                <option value="30" data-i18n="thirtyMinutes"></option>
                                <option value="40" data-i18n="fortyMinutes"></option>
                                <option value="50" data-i18n="fiftyMinutes"></option>
                                <option value="60" data-i18n="oneHour"></option>
                                <option value="90" data-i18n="ninetyMinutes"></option>
                                <option value="120" data-i18n="twoHours"></option>
                            </select>
                            <span class="sptcl-opt-label-default" data-i18n="defaultZeroMinutes"></span>
                        </div>

                        <div class="sptcl-opt-grouped">
                            <label
                                for="sptid-video-length-max"
                                class="sptcl-opt-label-text"
                                data-i18n="maximumLength"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="maximumLengthHelp"></span>
                            <select id="sptid-video-length-max" class="sptcl-form-select-input">
                                <option value="5" data-i18n="fiveMinutes"></option>
                                <option value="10" data-i18n="tenMinutes"></option>
                                <option value="20" data-i18n="twentyMinutes"></option>
                                <option value="30" data-i18n="thirtyMinutes"></option>
                                <option value="40" data-i18n="fortyMinutes"></option>
                                <option value="50" data-i18n="fiftyMinutes"></option>
                                <option value="60" data-i18n="oneHour"></option>
                                <option value="90" data-i18n="ninetyMinutes"></option>
                                <option value="120" data-i18n="twoHours"></option>
                            </select>
                            <span class="sptcl-opt-label-default" data-i18n="defaultThirtyMinutes"></span>
                        </div>

                        <div class="sptcl-opt-grouped">
                            <label
                                for="sptid-video-length-mode"
                                class="sptcl-opt-label-text"
                                data-i18n="outsideRangeAction"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="outsideRangeHelp"></span>
                            <select id="sptid-video-length-mode" class="sptcl-form-select-input">
                                <option value="fade" data-i18n="fadeOption"></option>
                                <option value="hide" data-i18n="hideOption"></option>
                            </select>
                            <span class="sptcl-opt-label-default" data-i18n="hideIsStricter"></span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="sptcl-cp-section sptcl-grid-panel">
                <div class="sptcl-cp-section-header">
                    <h2 data-i18n="videoViewsTitle"></h2>
                    <p class="sptcl-cp-section-description" data-i18n="videoViewsDescription"></p>
                </div>

                <label for="sptid-do-filter-by-views" class="sptcl-opt-grouped">
                    <span class="sptcl-opt-grouped-inner">
                        <input type="checkbox" id="sptid-do-filter-by-views" class="sptcl-form-checkbox-input" />
                        <span>
                            <span class="sptcl-opt-label-text" data-i18n="applyViewsTitle"></span>
                            <span class="sptcl-opt-label-help" data-i18n="applyViewsHelp"></span>
                        </span>
                    </span>
                    <span class="sptcl-opt-label-default" data-i18n="defaultOff"></span>
                </label>

                <div id="sptid-video-views-group">
                    <div class="sptcl-grid-fields">
                        <div class="sptcl-opt-grouped">
                            <label
                                for="sptid-video-views-min"
                                class="sptcl-opt-label-text"
                                data-i18n="minimumViews"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="minimumViewsHelp"></span>
                            <select id="sptid-video-views-min" class="sptcl-form-select-input">
                                <option value="0">0</option>
                                <option value="100">100</option>
                                <option value="500">500</option>
                                <option value="1000">1K</option>
                                <option value="10000">10K</option>
                                <option value="50000">50K</option>
                                <option value="100000">100K</option>
                                <option value="500000">500K</option>
                                <option value="1000000">1M</option>
                                <option value="5000000">5M</option>
                            </select>
                            <span class="sptcl-opt-label-default" data-i18n="defaultZero"></span>
                        </div>

                        <div class="sptcl-opt-grouped">
                            <label
                                for="sptid-video-views-max"
                                class="sptcl-opt-label-text"
                                data-i18n="maximumViews"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="maximumViewsHelp"></span>
                            <select id="sptid-video-views-max" class="sptcl-form-select-input">
                                <option value="100">100</option>
                                <option value="500">500</option>
                                <option value="1000">1K</option>
                                <option value="10000">10K</option>
                                <option value="50000">50K</option>
                                <option value="100000">100K</option>
                                <option value="500000">500K</option>
                                <option value="1000000">1M</option>
                                <option value="5000000">5M</option>
                            </select>
                            <span class="sptcl-opt-label-default" data-i18n="defaultOneMillion"></span>
                        </div>

                        <div class="sptcl-opt-grouped">
                            <label
                                for="sptid-video-views-mode"
                                class="sptcl-opt-label-text"
                                data-i18n="outsideRangeAction"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="outsideRangeHelp"></span>
                            <select id="sptid-video-views-mode" class="sptcl-form-select-input">
                                <option value="fade" data-i18n="fadeOption"></option>
                                <option value="hide" data-i18n="hideOption"></option>
                            </select>
                            <span class="sptcl-opt-label-default" data-i18n="unrecognizedViewsImpact"></span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="sptcl-cp-section sptcl-grid-panel">
                <div class="sptcl-cp-section-header">
                    <h2 data-i18n="categoriesTitle"></h2>
                    <p class="sptcl-cp-section-description">
                        <span data-i18n="categoriesDescriptionStart"></span>
                        <a
                            href="https://www.youtube.com/feed/subscriptions"
                            target="_blank"
                            rel="noreferrer"
                            class="sptcl-el-link"
                            data-i18n="subscriptionsPage"
                        ></a
                        >,
                        <span data-i18n="categoriesDescriptionMiddle"></span>
                        <a
                            href="https://www.youtube.com/feed/channels"
                            target="_blank"
                            rel="noreferrer"
                            class="sptcl-el-link"
                            data-i18n="channelsPage"
                        ></a
                        >.
                    </p>
                </div>

                <label for="sptid-do-categorize-subscription" class="sptcl-opt-grouped">
                    <span class="sptcl-opt-grouped-inner">
                        <input
                            type="checkbox"
                            id="sptid-do-categorize-subscription"
                            class="sptcl-form-checkbox-input"
                        />
                        <span>
                            <span class="sptcl-opt-label-text" data-i18n="enableCategoriesTitle"></span>
                            <span class="sptcl-opt-label-help" data-i18n="enableCategoriesHelp"></span>
                        </span>
                    </span>
                    <span class="sptcl-opt-label-default" data-i18n="defaultOn"></span>
                </label>

                <div class="sptcl-opt-grouped">
                    <form id="sptid-category-form" class="sptcl-opt-category-toolbar">
                        <div class="sptcl-opt-category-toolbar-inner">
                            <label
                                for="sptid-category-name"
                                class="sptcl-opt-label-text"
                                data-i18n="categoryName"
                            ></label>
                            <span class="sptcl-opt-label-help" data-i18n="categoryHelp"></span>
                            <input
                                type="text"
                                id="sptid-category-name"
                                class="sptcl-form-text-input"
                                data-i18n-placeholder="categoryPlaceholder"
                                maxlength="30"
                                autocomplete="off"
                            />
                        </div>
                        <button class="sptcl-form-button" type="submit" data-i18n="addCategory"></button>
                    </form>

                    <p class="sptcl-opt-category-list-heading"><strong data-i18n="savedCategories"></strong></p>
                    <ul id="sptid-categories-list" class="sptcl-opt-category-list-categories"></ul>
                    <p class="sptcl-opt-label-default" data-i18n="deleteCategoryImpact"></p>
                </div>
            </section>

            <section class="sptcl-cp-section sptcl-grid-panel">
                <div class="sptcl-cp-section-header">
                    <h2 data-i18n="resetTitle"></h2>
                    <p class="sptcl-cp-section-description" data-i18n="resetDescription"></p>
                </div>
                <button
                    id="sptid-settings-reset"
                    class="sptcl-form-button"
                    type="button"
                    data-i18n="resetButton"
                ></button>
            </section>
        </main>

        <script src="i18n.js"></script>
        <script src="options.js"></script>
    </body>
</html>
